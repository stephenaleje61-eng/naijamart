      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5E5E5" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.35" />
  <!-- Shopping Bag Handle -->
  <path d="M192 172 v-28 c0 -35.3 28.7 -64 64 -64 s64 28.7 64 64 v28" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />
