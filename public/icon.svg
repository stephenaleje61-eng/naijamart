  <!-- Bottom Market Bar -->
  <rect x="176" y="366" width="160" height="28" rx="14" fill="#000000" fill-opacity="0.9" />
  <text x="256" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="17" letter-spacing="4" fill="#FFFFFF">MARKET</text>
</svg>
