<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — NIGERIA CAMPUS MARKET</title>
    <meta name="theme-color" content="#F68B1F" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f7f7f7;
        color: #303030;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border: 1px solid #eeeeee;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(34, 34, 34, 0.12);
        text-align: center;
      }
      .header {
        background: linear-gradient(135deg, #ff6a00 0%, #f68b1f 100%);
        color: #ffffff;
        padding: 28px 24px;
        border-bottom: 4px solid #222222;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        border: 2px solid #ffffff;
        background: #ffffff;
        margin-bottom: 12px;
      }
      .badge {
        display: inline-block;
        background: #222222;
        color: #ffffff;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 999px;
        margin-bottom: 10px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .body {
        padding: 24px;
      }
      p {
        margin: 0 0 16px 0;
        font-size: 14px;
        line-height: 1.6;
        color: #303030;
      }
      .status {
        display: none;
        margin-bottom: 16px;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.5;
      }
      .status.visible {
        display: block;
      }
      .status.checking {
        background: #fff4eb;
        color: #222222;
        border: 1px solid #f68b1f;
      }
      .status.error {
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }
      .status.success {
        background: #ecfdf5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 13px 18px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
        border: none;
      }
      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      .primary {
        background: #ff6a00;
        color: #ffffff;
      }
      .secondary {
        background: #f7f7f7;
        color: #222222;
        border: 1px solid #eeeeee;
      }
      .footer {
        margin-top: 18px;
        font-size: 11px;
        color: #6b7280;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="header">
        <img src="/pwa-192x192.png" alt="NIGERIA CAMPUS MARKET" class="logo" />
        <div><span class="badge">Connection Interrupted</span></div>
        <h1>NIGERIA CAMPUS MARKET</h1>
      </div>
      <div class="body">
        <p>
          We could not reach the NIGERIA CAMPUS MARKET server right now. Check your mobile data (4G/5G) or campus Wi-Fi and tap Retry Connection below.
        </p>

        <div id="connection-status" class="status" role="status" aria-live="polite"></div>

        <div class="actions">
          <button type="button" id="retry-btn" class="primary">
            Retry Connection
          </button>
          <a href="/" id="home-btn" class="secondary">Return to Home</a>
        </div>
        <div class="footer">
          Shop Faster, Anytime, Anywhere — Learn. Connect. Buy. Sell. Grow.
        </div>
      </div>
    </main>

    <script>
      (function () {
        var retryBtn = document.getElementById('retry-btn');
        var homeBtn = document.getElementById('home-btn');
        var statusEl = document.getElementById('connection-status');
        var isChecking = false;

        function setStatus(type, message) {
          if (!statusEl) return;
          statusEl.className = 'status visible ' + type;
          statusEl.textContent = message;
        }

        async function refreshServiceWorkerBeforeNavigate() {
          if (!('serviceWorker' in navigator)) return;
          try {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              regs.map(function (reg) {
                return reg.update().catch(function () {});
              })
            );
          } catch (_) {
            // Non-fatal
          }
        }

        async function testServerReachability() {
          var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var timeoutId = controller
            ? setTimeout(function () {
                controller.abort();
              }, 5000)
            : null;

          try {
            var healthRes = await fetch('/api/health?probe=' + Date.now(), {
              method: 'GET',
              cache: 'no-store',
              headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
              signal: controller ? controller.signal : undefined
            });
            if (healthRes && healthRes.ok) {
              return true;
            }
          } catch (_) {
            // Fall through to manifest/root check
          } finally {
            if (timeoutId) clearTimeout(timeoutId);
          }

          var fallbackController =
            typeof AbortController !== 'undefined' ? new AbortController() : null;
          var fallbackTimeout = fallbackController
            ? setTimeout(function () {
                fallbackController.abort();
              }, 4000)
            : null;

          try {
            var rootRes = await fetch('/manifest.json?probe=' + Date.now(), {
              method: 'HEAD',
              cache: 'no-store',
              signal: fallbackController ? fallbackController.signal : undefined
            });
            return Boolean(rootRes && rootRes.ok);
          } catch (_) {
            return false;
          } finally {
            if (fallbackTimeout) clearTimeout(fallbackTimeout);
          }
        }

        async function attemptRecovery(userTriggered) {
          if (isChecking) return;
          isChecking = true;

          if (userTriggered && retryBtn) {
            retryBtn.disabled = true;
            retryBtn.textContent = 'Checking Connection...';
            setStatus('checking', 'Testing live connection to NIGERIA CAMPUS MARKET...');
          }

          var reachable = await testServerReachability();
          if (reachable) {
            setStatus('success', 'Connection active! Loading NIGERIA CAMPUS MARKET...');
            await refreshServiceWorkerBeforeNavigate();
            var targetUrl = window.location.pathname === '/offline.html' ? '/' : window.location.pathname + window.location.search;
            if (!targetUrl || targetUrl === '/offline.html') targetUrl = '/';
            window.location.replace(targetUrl);
            return;
          }

          if (userTriggered) {
            setStatus(
              'error',
              'Still unable to reach the server. Verify your mobile data or Wi-Fi is turned on and try again.'
            );
          }

          if (retryBtn) {
            retryBtn.disabled = false;
            retryBtn.textContent = 'Retry Connection';
          }
          isChecking = false;
        }

        if (retryBtn) {
          retryBtn.addEventListener('click', function () {
            attemptRecovery(true);
          });
        }

        if (homeBtn) {
          homeBtn.addEventListener('click', function (ev) {
            ev.preventDefault();
            attemptRecovery(true);
          });
        }

        window.addEventListener('online', function () {
          attemptRecovery(false);
        });

        // Immediately verify on load so online 4G visitors never remain stuck on offline.html
        attemptRecovery(false);

        // Gently check every 8 seconds while page is visible until connection restores
        setInterval(function () {
          if (document.visibilityState === 'visible') {
            attemptRecovery(false);
          }
        }, 8000);
      })();
    </script>
  </body>
</html>
